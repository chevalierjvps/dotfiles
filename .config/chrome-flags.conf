--password-store=gnome-libsecret
# Native Wayland, not Xwayland.
--ozone-platform=wayland
--enable-wayland-ime
--wayland-text-input-version=3
# Disable GPU video decoding and GPU memory buffers for video frames.
# This prevents Wayland DRM PRIME / GBM buffer synchronization deadlocks
# across hybrid GPUs (Intel iGPU display / NVIDIA dGPU compositor) on YouTube
# (VP9/AV1 60fps). Video decoding falls back smoothly to multi-threaded CPU
# (dav1d/ffmpeg) with zero frame drops or freezing.
--disable-accelerated-video-decode
--disable-gpu-memory-buffer-video-frames
--disable-features=VaapiVideoDecoder,VaapiVideoEncoder

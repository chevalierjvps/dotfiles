# MangoHud é um layer implícito do Vulkan (ativa em qualquer processo Vulkan
# por padrão). Estava crashando o quickshell/ryoku-shell (segfault dentro de
# libMangoHud.so ao criar o MediaPlayer do widget de música via Vulkan).
# Isso não afeta overlay em jogos lançados via `mangohud %command%`, que
# define MANGOHUD=1 explicitamente por cima disso.
DISABLE_MANGOHUD=1

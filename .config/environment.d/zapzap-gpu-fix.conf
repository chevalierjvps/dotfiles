# ZapZap (PyQt6-WebEngine/Chromium) trava com SIGABRT em sistemas com GPU
# híbrida: o processo de GPU do Chromium escolhe um render node do DRM
# diferente do que o compositor realmente usa pra tela, e a importação
# cross-GPU do buffer (gbm_bo_import) falha com EGL_BAD_MATCH.
# Confirmado no upstream: https://github.com/rafatosta/zapzap/issues/790
# --disable-gpu-compositing evita o crash mantendo aceleração de vídeo/raster.
QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu-compositing

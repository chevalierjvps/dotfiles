# ══════════════════════════════════════════════════════════════════
# Keybinds — espelha o mais fiel possível o keybinds.kdl do Niri
# (mesmo Mod=Super, mesmas teclas). Ações sem equivalente direto no
# modelo de tags do Mango (consume/expel de coluna, foco de coluna
# first/last, center-column) foram omitidas em vez de inventadas.
# ══════════════════════════════════════════════════════════════════

# obs: mango recarrega a config sozinho ao salvar (hot-reload nativo),
# não precisa de bind dedicado — SUPER+R fica livre pro preset de largura.

# ─── Aplicativos ───
bind=SUPER,Return,spawn,kitty
bind=SUPER,t,spawn,kitty
bind=SUPER,z,spawn,kitty
bind=SUPER,w,spawn,brave-origin-nightly --load-extension=/home/jagermeister/.local/share/chrome-themes/amberglow-brave
bind=SUPER,b,spawn,brave-origin-nightly --load-extension=/home/jagermeister/.local/share/chrome-themes/amberglow-brave
bind=SUPER,e,spawn,nautilus
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER+CTRL,Return,spawn,rofi -show drun
bind=SUPER,v,spawn,~/.config/rofi/scripts/clipboard.sh
bind=SUPER,comma,spawn,kitty -e nvim ~/.config/mango/config.conf
bind=SUPER+SHIFT,w,spawn,~/.config/rofi/scripts/wallpaper.sh
bind=SUPER+SHIFT,b,spawn,~/.local/bin/restart-waybar

# scratchpads (instância única: aperta de novo pra esconder)
bind=SUPER+SHIFT,e,toggle_named_scratchpad,org.gnome.Nautilus,none,nautilus
bind=SUPER+SHIFT,t,toggle_named_scratchpad,none,kitty-scratch,kitty -T kitty-scratch

# ryotunes flutuante, grande e centralizado
bind=SUPER,j,spawn,ryotunes

# notificações (mako não tem painel: reexibe a última dispensada)
bind=SUPER,n,spawn,makoctl restore
bind=SUPER,c,spawn,makoctl dismiss --all

# lock / power
bind=SUPER,l,spawn,swaylock
bind=ALT+SUPER,l,spawn,swaylock
bind=SUPER+SHIFT,q,spawn,~/.config/rofi/scripts/powermenu.sh

# overview (equivalente ao Mod+Tab do niri)
bind=SUPER,Tab,toggleoverview,1

# ─── Gerenciamento de janelas ───
bind=SUPER,q,killclient,
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+SHIFT,r,switch_proportion_preset,prev

# ─── Navegação de foco (setas) ───
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ─── Mover janela (Shift+setas) ───
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# ─── Redimensionar (Ctrl+setas) ───
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50

# scroller: empilhar coluna (equivalente parcial ao consume/expel do niri)
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down

# ─── Multi-monitor ───
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT,Up,focusmon,up
bind=SUPER+ALT,Down,focusmon,down
bind=SUPER+SHIFT+ALT,Left,tagmon,left
bind=SUPER+SHIFT+ALT,Right,tagmon,right
bind=SUPER+SHIFT+ALT,Up,tagmon,up
bind=SUPER+SHIFT+ALT,Down,tagmon,down
bind=none,XF86Display,spawn,~/.config/mango/scripts/toggle-edp.sh toggle
bind=SUPER+ALT,d,spawn,~/.config/mango/scripts/toggle-edp.sh toggle


# ─── Workspaces (tags 1-9) ───
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER,UP,viewtoleft

# ─── Gaps (não existia no niri — convenção nativa do mango, não conflita) ───
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# ─── Screenshots (sempre salvos em ~/Pictures/Screenshots, além do clipboard) ───
bind=none,Print,spawn,~/.config/mango/scripts/screenshot.sh region
bind=SUPER,Print,spawn,~/.config/mango/scripts/screenshot.sh full
bind=SUPER+SHIFT,Print,spawn,~/.config/mango/scripts/screenshot.sh region

# ─── Mídia / volume / mic (mesmo padrão XF86 do niri) ───
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioPause,spawn,playerctl play-pause

# ─── Brilho ───
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ─── Sistema / energia ───
bind=SUPER+SHIFT,l,spawn,systemctl suspend-then-hibernate
bind=CTRL+ALT,Delete,quit

# ─── Mouse ───
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

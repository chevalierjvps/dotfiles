# Picture-in-Picture do navegador sempre em opacidade cheia (mesma
# exceção que existia no rules.kdl do Niri para zen-browser PiP)
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,isfloating:1,appid:brave-origin-nightly,title:Picture-in-Picture

# Diálogos/pickers GTK como janelas flutuantes pequenas
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

# Painel de volume/dispositivos e o terminal de rede (nmtui): flutuantes,
# abertos a partir dos ícones da waybar — não fazem sentido tiled.
windowrule=isfloating:1,appid:org.pulseaudio.pavucontrol
windowrule=isfloating:1,appid:nmtui-float

# Scratchpads: gerenciador de arquivos (SUPER+SHIFT+E) e terminal dedicado
# (SUPER+SHIFT+T) — instância única, esconde/mostra sem fechar a sessão.
windowrule=isnamedscratchpad:1,width:0.7,height:0.75,appid:org.gnome.Nautilus
windowrule=isnamedscratchpad:1,width:0.6,height:0.7,title:kitty-scratch

# Ryotunes: janela flutuante grande e centralizada (SUPER+J) — appid é o
# genérico "org.quickshell" (compartilhado por outros apps Quickshell/Ryoku),
# então casa pelo title específico em vez disso.
windowrule=isfloating:1,width:0.6,height:0.75,title:Ryotunes

# camadas: sem sombra/anim no picker de região da tela (deve ser instantâneo)
layerrule=noanim:1,noshadow:1,layer_name:selection

# rofi abre com zoom, sem blur (retro = painel sólido)
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi

# waybar sem sombra (já tem borda própria no CSS)
layerrule=noshadow:1,layer_name:waybar

# notificações mako: fade simples, sem sombra difusa
layerrule=animation_type_open:fade,animation_type_close:fade,noshadow:1,layer_name:notifications

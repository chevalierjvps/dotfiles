# ══════════════════════════════════════════════════════════════════
# MangoWM — rice "Amberglow"
# Retomada retro (CRT/phosphor) do tema Gruvbox Material Hard usado no
# Niri: mesma família de cores (verde/laranja sobre marrom-escuro), mas
# mais quente/saturada, sem blur, sombras duras e curtas, cantos quase
# retos — como um terminal âmbar antigo em vez de vidro fosco moderno.
# ══════════════════════════════════════════════════════════════════

# ── Efeitos: bem pouco blur, só atrás de janelas com transparência real
# (unfocused_opacity abaixo) — painéis (waybar/rofi/mako) continuam sólidos,
# blur_layer fica desligado pra não virar vidro fosco moderno ──
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=3
blur_params_num_passes=1
blur_params_noise=0.02
blur_params_brightness=0.95
blur_params_contrast=0.95
blur_params_saturation=1.05

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=6
shadows_blur=6
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000aa

border_radius=3
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=0.88

# ── Animações: mais secas e rápidas que o niri (retro = mecânico, não elástico) ──
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.6
zoom_end_ratio=0.85
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8
animation_duration_move=160
animation_duration_open=160
animation_duration_tag=180
animation_duration_close=140
animation_duration_focus=0
animation_curve_open=0.2,0.8,0.2,1
animation_curve_move=0.2,0.8,0.2,1
animation_curve_tag=0.2,0.8,0.2,1
animation_curve_close=0.4,0,1,1
animation_curve_focus=0.2,0.8,0.2,1
animation_curve_opafadeout=0.4,0,1,1
animation_curve_opafadein=0.2,0.8,0.2,1

# ── Scroller: replica a coluna deslizante do niri (larguras 1/3, 1/2, 2/3) ──
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# ── Master-Stack (fallback pra quem preferir tile clássico numa tag) ──
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# ── Overview ──
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=6
overviewgappo=24

# ── Misc / foco / input geral ──
no_border_when_single=0
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=24
cursor_size=24
cursor_theme=Bibata-Modern-Amber

# ── Teclado (mesmo layout do niri: us/br com toggle alt+shift) ──
# fallback global pra qualquer teclado não listado abaixo
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us,br
xkb_rules_variant=intl,abnt2
xkb_rules_options=grp:alt_shift_toggle

# teclado do notebook: hardware é ABNT2 de verdade, sem toggle
devicerule=name:AT Translated Set 2 keyboard,kb_layout:br,kb_variant:abnt2

# teclado externo (ROYUAN): US intl, sem toggle
devicerule=name:ROYUAN Gaming Keyboard,kb_layout:us,kb_variant:intl

# ── Trackpad (mesmas prefs do niri: tap-to-click + natural scroll) ──
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1

# ── Mouse ──
mouse_natural_scrolling=0

# ── Aparência: gaps mais fechados que o niri (14) — densidade de
# terminal retro em vez do respiro mais "moderno" ──
gappih=8
gappiv=8
gappoh=12
gappov=12
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.85
borderpx=3

# Paleta "Amberglow" (0xRRGGBBAA)
# rootcolor: fundo, marrom quase preto (mais quente que preto puro)
# bordercolor: borda inativa, cinza-marrom apagado
# focuscolor: âmbar — janela em foco (equivalente ao focus-ring do niri)
# splitcolor: linha de split/indicador, dourado pálido
# maximizescreencolor: verde fósforo — maximizado
# urgentcolor: vermelho de alerta CRT
# scratchpadcolor: teal apagado
# globalcolor: ameixa apagado — janela global
# overlaycolor: creme claro — overlay/overview
# dropcolor: verde translúcido — alvo de drag-and-drop
rootcolor=0x1a150fff
bordercolor=0x4a3f30ff
focuscolor=0xe8952dff
splitcolor=0xd8c48aff
maximizescreencolor=0x9dbb5cff
urgentcolor=0xd9483dff
scratchpadcolor=0x6a8a7aff
globalcolor=0x9a6a8aff
overlaycolor=0xf0dfb8ff
dropcolor=0x9dbb5c66

# tags: 1-6 no layout scroller (estilo niri), 7-9 em tile clássico
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ── sub-configs ──
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf

# ── autostart ──
exec-once=/bin/bash /home/jagermeister/.config/mango/autostart.sh

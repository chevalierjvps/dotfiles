# ══════════════════════════════════════════════════════════════════════════════
#  ⚡ MPV CONFIGURATION — AMBERGLOW CRT & HYBRID GPU ACCELERATION ⚡
# ══════════════════════════════════════════════════════════════════════════════

# ── Video Output & Hardware Acceleration ──
vo=gpu
gpu-context=wayland
hwdec=nvdec-copy,vaapi-copy,auto-safe

# ── Performance & Buffering ──
# Grande buffer de demuxer para evitar qualquer engasgo em vídeos pesados ou 4K
demuxer-max-bytes=256M
demuxer-max-back-bytes=64M
demuxer-readahead-secs=20
hr-seek=yes
hr-seek-framedrop=yes

# ── Audio Output ──
ao=pipewire,pulse
audio-file-auto=fuzzy
volume-max=150

# ── Subtitles ──
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=36
sub-color="#FFFFFF"
sub-border-color="#12100E"
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#000000"

# ── Window & Behavior ──
keep-open=yes
cursor-autohide=1000
autofit-larger=90%x90%
geometry=50%:50%

# ── OSD (On-Screen Display) — Amberglow CRT Theme ──
osd-font="JetBrainsMono Nerd Font"
osd-font-size=24
osd-color="#E8952D"
osd-border-color="#12100E"
osd-border-size=2
osd-shadow-offset=1
osd-shadow-color="#000000"
osd-bar=yes
osd-bar-w=60
osd-bar-h=2.5

# ── Screenshots ──
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Pictures/Screenshots"
screenshot-template="mpv_%Y-%m-%d_%H-%M-%S"

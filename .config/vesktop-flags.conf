# Flags para o Vesktop no Linux (Wayland + NVIDIA/Intel)
# Desativa a decodificação de vídeo por GPU (VA-API/NVDEC) no Electron/Chromium,
# forçando decodificação estável por CPU para streams recebidos no Discord (WebRTC),
# o que resolve o bug de tela preta/carregamento infinito ao assistir telas compartilhadas.
--disable-accelerated-video-decode
--disable-features=VaapiVideoDecoder
--enable-wayland-ime
--wayland-text-input-version=3
# --- DiscordGoLiveBypass (auto, nao editar a mao) ---
--proxy-server=socks5://107.167.18.122:443,direct://
--proxy-bypass-list=cdn.discordapp.com;*.discordapp.net;*.discord.media;*.storage.googleapis.com;<local>
# --- fim DiscordGoLiveBypass ---
